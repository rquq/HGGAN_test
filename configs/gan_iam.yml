device: 'cuda:0'
multi_gpu: false
gpus: [0]
model: 'gl_adversarial_model'
dataset: 'iam_word'
seed: 123456
img_height: 64
char_width: 32
# SpiS-IAM uses 339 train writers and 161 held-out test writers.
data_profile: 'spis_iam_64'
expected_train_writers: 339
expected_test_writers: 161
expected_width_multiple: 32


inference:
  ckpt: './pretrained/HiGAN+.pth'
  mode: 'text'
  guided: true
  deploy_dst: './pretrained/deploy_HiGAN+.pth'


training:
  dset_split: 'trnval'
  # Cumulative scratch schedule: preserve useful adversarial updates through
  # the refinement phase, then keep a non-trivial floor for stable GAN polishing.
  # Keep these values unchanged across Kaggle resumes.
  epochs: 60
  lr_policy: 'linear'
  # Epochs 1-24 use full LR; epoch 25 is the first reduced-LR epoch.
  start_decay_epoch: 24
  n_epochs_decay: 36
  min_lr_ratio: 0.25
  batch_size: 8
  eval_batch_size: 12
  num_workers: 4
  eval_num_workers: 4
  sample_num_workers: 0
  persistent_workers: true
  prefetch_factor: 2
  sample_nrow: 4
  # optimization:
  lr: 1.5e-4
  d_lr: 1.0e-4
  # StrokePatchD is compact and was underfitting at the global critic LR.
  patch_d_lr: 1.5e-4
  adam_b1: 0.5
  adam_b2: 0.999
  # sampling and saving
  sample_iter_val: 500
  print_iter_val: 20
  start_save_epoch_val: 0
  eval_epoch_val: 1
  save_epoch_val: 1
  # val_iter: 6500
  sample_dir: 'imgs'
  ckpt_dir: 'ckpts'
  lexicon: './data/english_words.txt'
  max_word_len: 20
  n_class: 80
  capitalize_ratio: 0.5
  blank_ratio: 0.
  sort_input: true
  # One D/P step per G step prevents the global critic from outrunning G.
  num_critic_train: 1
  # Limit local adversarial pressure on G to avoid stray stroke artifacts.
  lambda_patch_adv: 0.5
  patch_size: 32
  min_patch_crops: 4
  max_patch_crops: 8
  # Keep character-centered crops close enough to the intended allograph while
  # retaining small translation tolerance for real handwriting alignment.
  patch_char_jitter: 4
  # Mild word-safe DiffAug is applied to both real and fake global-D inputs.
  d_diffaug: true
  d_aug_translate: 4
  d_aug_width_scale: 0.05
  vae_mode: true
  lambda_ctc: 1.0
  # Preserve content while gradually releasing capacity for writer style.
  lambda_ctc_final: 0.4
  ctc_decay_start_epoch: 10
  ctc_decay_end_epoch: 20
  lambda_info: 1.0
  lambda_wid: 0.5
  lambda_recn: 10.0
  lambda_recn_final: 2.5
  recn_decay_start_epoch: 24
  recn_decay_end_epoch: 42
  lambda_style_cycle: 1.0
  lambda_content_adv: 0.02
  lambda_kl: 0.1
  lambda_ctx: 0.1
  grad_clip: 5.0
  r1_interval: 16
  lambda_r1: 0.02
  update_ema: true
  ema_beta: 0.9998
  pretrained_w: './pretrained/wid_iam_spis_train64.pth'
  pretrained_r: './pretrained/ocr_iam_new.pth'
  pretrained_ckpt: ''
  masking_mode: 'combined'


valid:
  dset_name: 'iam_word'
  dset_split: 'test'
  # Fixed validation seed makes KID subsets and generated validation data
  # directly comparable without perturbing the subsequent training RNG.
  eval_seed: 123456
  # Keep FID/KID directly comparable with SpiS-GAN IAM-64. This is a
  # validation contract only; it never changes image preprocessing or scores.
  fid_kid_protocol: 'spis_gan_iam64'
  validate_fid: true
  validate_kid: true
  validate_hwd: true
  validate_cmmd: false
  validate_cmmd_every_n_epochs: 4
  validate_cer: false
  validate_wer: false
  validate_is_gen: true
  validate_is_org: true
  validate_psnr: false
  validate_mssim: false
  validate_wier: false
  use_rand_corpus: false
  n_rand_repeat: 10
  batch_size: 8
  hwd_batch_size: 32
  dims: 2048
  mmd_degree: 3
  mmd_gamma: ~
  mmd_coef0: 1.
  mmd_subsets: 50
  mmd_subset_size: 1000
  mmd_var: true
  pretrained_test_w: './pretrained/wid_iam_spis_test64.pth'
  test_wid_model:
    n_writer: 161
    in_dim: 256
    init: 'none'
  ctcdecode:
    model_path: ~ #'./data/english_word_3gram.binary'
    blank_id: 0
    alpha: 1
    beta: 3
    beam_width: 32
    cutoff_prob: 0.9999
    cutoff_top_n: 32
    num_processes: 8


test:
  interp_num: 7
  nrow: 8


# network configuration
GenModel:
  G_ch: 64
  style_dim: 32
  fusion_gate_init: 0.25
  local_projection_residual_init: 0.1
  allograph_routing_temperature: 0.7
  allograph_routing_center_init: 0.5
  allograph_routing_scale_max: 2.0
  allograph_routing_uniform_mix: 0.05
  allograph_modulation_limit: 0.3
  allograph_residual_init: 0.5
  allograph_modulation_rms_cap: 1.0
  bottom_width: 4
  bottom_height: 4
  resolution: 64
  G_kernel_size: 3
  G_attn: '0'
  n_class: 80
  embed_dim: 120
  embed_pad_idx: 0
  embed_max_norm: 1.0
  num_G_SVs: 1
  num_G_SV_itrs: 1
  cross_replica: false
  mybn: false
  BN_eps: 1.e-05
  SN_eps: 1.e-08
  init: 'N02'
  G_param: 'SN'
  norm_style: 'bn'
  bn_linear: 'SN'
  input_nc: 1


DiscModel:
  D_ch: 64
  D_wide: true
  resolution: 64
  D_attn: '0'
  width_context: true
  width_heads: 4
  num_D_SVs: 1
  num_D_SV_itrs: 1
  SN_eps: 1.e-08
  output_dim: 1
  init: 'N02'
  D_param: 'SN'
  input_nc: 1


PatchDiscModel:
  D_ch: 32
  D_max_ch: 192
  D_layers: 3
  num_D_SVs: 1
  num_D_SV_itrs: 1
  SN_eps: 1.e-08
  output_dim: 1
  init: 'N02'
  D_param: 'SN'
  input_nc: 1
  n_class: 80

OcrModel:
  resolution: 16
  max_dim: 256
  in_channel: 1
  norm: 'bn'
  init: 'none'
  dropout: 0.
  # ctc config
  n_class: 80
  rnn_depth: 2
  bidirectional: true


StyBackbone:
  resolution: 16
  max_dim: 256
  in_channel: 1
  init: 'N02'
  dropout: 0.0
  norm: 'bn'


EncModel:
  style_dim: 32
  in_dim: 256
  num_style_tokens: 8
  backbone_channels: [64, 128, 256]
  n_class: 80
  content_grl: 1.0
  local_query_residual: 0.5
  local_attention_residual_init: 0.25
  local_query_anchor_strength: 0.5
  init: 'none'


WidModel:
  n_writer: 339
  in_dim: 256
  init: 'none'
