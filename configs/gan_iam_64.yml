# Runtime
device: cuda:0
multi_gpu: false
gpus: [0]
seed: 123456
model: gl_adversarial_model

# Dataset geometry and source convention
dataset: iam_word
dataset_source_polarity: white
img_height: 64
char_width: 32
expected_train_writers: 339
expected_width_multiple: 32

training:
  # Data and initialization
  dset_split: trnval
  pretrained_ckpt: ''
  pretrained_w: ./pretrained/wid_iam_train64.pth
  pretrained_r: ./pretrained/ocr_iam_train64.pth

  # Batches and data loading
  batch_size: 8
  eval_batch_size: 8
  num_workers: 4
  eval_num_workers: 4
  sample_num_workers: 0
  persistent_workers: true
  prefetch_factor: 3
  sort_input: true

  # Optimizers and update cadence
  lr: 0.0002
  d_lr: 0.0002
  patch_d_lr: 0.0002
  adam_b1: 0.5
  adam_b2: 0.999
  num_critic_train: 2
  grad_clip: 5.0

  # Epoch schedule
  epochs: 80
  lr_policy: linear
  start_decay_epoch: 36
  n_epochs_decay: 48
  min_lr_ratio: 0.15

  # Exponential moving averages
  update_ema: true
  ema_beta: 0.9998

  # Text sampling
  lexicon: ./data/english_words.txt
  max_word_len: 20
  n_class: 81
  capitalize_ratio: 0.5
  blank_ratio: 0.0
  rare_word_ratio: 0.15

  # Patch adversarial objective
  use_patch_discriminator: true
  lambda_patch_adv: 0.45

  # OCR objectives and schedules
  lambda_ctc_rand: 1.0
  lambda_ctc_rand_final: 0.4
  ctc_rand_decay_start_epoch: 10
  ctc_rand_decay_end_epoch: 20
  lambda_ctc_style: 0.5
  lambda_ctc_style_final: 0.4
  ctc_style_decay_start_epoch: 8
  ctc_style_decay_end_epoch: 28

  # Reconstruction and style objectives
  vae_mode: true
  lambda_recn: 10.0
  lambda_recn_final: 2.5
  recn_decay_start_epoch: 24
  recn_decay_end_epoch: 42
  lambda_wid: 0.25
  lambda_info: 1.0
  lambda_style_cycle: 0.0
  lambda_content_adv: 0.02
  lambda_kl: 0.1
  lambda_ctx: 0.1
  style_loss_normalization_tokens: 8

  # Augmentation and regularization
  d_diffaug: true
  d_aug_translate: 4
  d_aug_width_scale: 0.05
  r1_interval: 32
  lambda_r1: 0.01

  # Logging, evaluation, saving and exports
  print_iter_val: 20
  sample_iter_val: 500
  sample_nrow: 4
  eval_epoch_val: 1
  save_epoch_val: 1
  start_save_epoch_val: 0
  sample_dir: imgs
  ckpt_dir: ckpts

valid:
  # Dataset and metric switches
  dset_name: iam_word
  dset_split: test
  eval_seed: 123456
  validate_fid: true
  validate_kid: true
  validate_hwd: true
  validate_cmmd: false
  validate_cer: true
  validate_wer: true
  validate_is_gen: false
  validate_is_org: false
  validate_psnr: false
  validate_mssim: false
  validate_wier: false

  # Independent OCR evaluation
  ocr_eval_every_n_epochs: 1
  ocr_eval_batch_size: 2

  # Feature extraction and sampling
  batch_size: 32
  hwd_batch_size: 32
  metric_cache_dtype: float32
  use_rand_corpus: false
  n_rand_repeat: 10
  dims: 2048
  validate_cmmd_every_n_epochs: 4

  # KID estimator
  mmd_degree: 3
  mmd_gamma: null
  mmd_coef0: 1.0
  mmd_subsets: 50
  mmd_subset_size: 1000
  mmd_var: true

  # Optional writer evaluation
  pretrained_test_w: ./pretrained/wid_iam_test64.pth
  test_wid_model:
    n_writer: 161
    in_dim: 256
    pool: attentive_stats
    attention_dim: 128
    init: none

StyBackbone:
  resolution: 16
  max_dim: 256
  in_channel: 1
  init: N02
  dropout: 0.0
  norm: bn

EncModel:
  # Global latent
  style_dim: 32
  in_dim: 256
  num_style_tokens: 1

  # Reference memory from the shared backbone's intermediate spatial features
  memory_feature_index: 1
  memory_dim: 64
  memory_height: 4
  memory_max_width: 32

  # Contextual-loss feature maps and initialization
  feature_scales: [1, 2, 4]
  init: none

GenModel:
  # Global conditioning and reference retrieval
  style_dim: 32
  use_reference_memory: true
  reference_memory_dim: 64
  reference_memory_height: 4
  fusion_nhead: 4
  fusion_attn_dim: 128
  fusion_ffn_dim: 360
  fusion_residual_init: 0.25

  # Content geometry and convolutional generator
  G_ch: 64
  embed_dim: 120
  embed_pad_idx: 0
  embed_max_norm: 1.0
  n_class: 81
  bottom_width: 4
  bottom_height: 4
  resolution: 64
  G_kernel_size: 3
  G_attn: '0'
  input_nc: 1

  # Normalization and initialization
  norm_style: bn
  bn_linear: SN
  G_param: SN
  num_G_SVs: 1
  num_G_SV_itrs: 1
  cross_replica: false
  mybn: false
  BN_eps: 1.0e-05
  SN_eps: 1.0e-08
  init: N02

DiscModel:
  pooling_gain: 32.0
  D_ch: 64
  D_wide: true
  resolution: 64
  D_attn: '0'
  num_D_SVs: 1
  num_D_SV_itrs: 1
  SN_eps: 1.0e-08
  output_dim: 1
  init: N02
  D_param: SN
  input_nc: 1

PatchDiscModel:
  D_ch: 64
  D_max_ch: 192
  D_layers: 3
  num_D_SVs: 1
  num_D_SV_itrs: 1
  SN_eps: 1.0e-08
  output_dim: 1
  init: N02
  D_param: SN
  input_nc: 1

OcrModel:
  resolution: 16
  max_dim: 256
  in_channel: 1
  norm: bn
  init: none
  dropout: 0.0
  n_class: 81
  rnn_depth: 2
  bidirectional: true

WidModel:
  n_writer: 339
  in_dim: 256
  pool: attentive_stats
  attention_dim: 128
  init: none

inference:
  ckpt: ./pretrained/best_fid.pth
  mode: text
  guided: true
  deploy_dst: ./pretrained/deploy.pth

test:
  interp_num: 7
  nrow: 8
