device: 'cuda:0'
multi_gpu: false
gpus: [0]
model: 'identifier_model'
dataset: 'iam_word'
seed: 123456
img_height: 64
finetune: false


training:
  dset_name: 'iam_word'
  dset_split: 'trnval'
  epochs: 74
  lr_policy: 'linear'
  start_decay_epoch: 40
  n_epochs_decay: 34
  batch_size: 32
  # optimization:
  lr: 1.0e-3
  # sampling and saving
  print_iter_val: 20
  start_save_epoch_val: 20
  save_epoch_val: 4
  ckpt_dir: 'ckpts'
  n_class: 80
  sort_input: true
  resume: ~
  pretrained_backbone: './pretrained/ocr_iam_train64.pth'
  random_clip: true
  process_style: true
  # Train W+B on both raw reference widths (used by E) and canonical/cropped
  # widths (used by generated words), with no additional objective.
  writer_input_policy: 'mixed'
  writer_raw_probability: 0.5
  # Temper inverse-frequency sampling so tail writers are seen more often
  # without repeatedly overfitting their very small number of samples.
  writer_balance_power: 0.5
  writer_balance_max_weight: 3.0
  frozen_backbone: false
  # Atomic export consumed by gan_iam.yml after pretraining.
  export_writer_teacher: "./pretrained/wid_iam_train64.pth"

valid:
  dset_split: 'trnval'
  batch_size: 256


StyBackbone:
  resolution: 16
  max_dim: 256
  in_channel: 1
  init: 'N02'
  dropout: 0.2
  norm: 'bn'


WidModel:
  n_writer: 339
  in_dim: 256
  init: 'none'
