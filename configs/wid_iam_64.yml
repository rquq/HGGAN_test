# Runtime
device: cuda:0
multi_gpu: false
gpus: [0]
seed: 123456
model: identifier_model

# Dataset geometry and source convention
dataset: iam_word
dataset_source_polarity: white
img_height: 64
finetune: false

training:
  # Data and initialization
  dset_name: iam_word
  dset_split: trnval
  resume: null
  pretrained_backbone: ./pretrained/ocr_iam_train64.pth
  frozen_backbone: false

  # Batches and data loading
  batch_size: 128
  sort_input: true

  # Optimizers and update cadence
  lr: 0.001

  # Epoch schedule
  epochs: 100
  lr_policy: linear
  start_decay_epoch: 60
  n_epochs_decay: 40

  # Exponential moving averages
  teacher_ema: true
  teacher_ema_beta: 0.999

  # Text sampling
  n_class: 81

  # Augmentation and regularization
  random_clip: true
  process_style: true
  writer_input_policy: mixed
  writer_raw_probability: 0.5
  writer_balance_power: 0.5
  writer_balance_max_weight: 3.0

  # Logging, evaluation, saving and exports
  print_iter_val: 20
  eval_epoch_val: 10
  ckpt_dir: ckpts
  export_writer_teacher: ./pretrained/wid_iam_train64.pth

valid:
  # Dataset and metric switches
  dset_split: trnval

  # Feature extraction and sampling
  batch_size: 256

StyBackbone:
  resolution: 16
  max_dim: 256
  in_channel: 1
  init: N02
  dropout: 0.2
  norm: bn

WidModel:
  n_writer: 339
  in_dim: 256
  pool: attentive_stats
  attention_dim: 128
  init: none
