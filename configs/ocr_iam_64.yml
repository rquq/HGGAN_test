# Runtime
device: cuda:0
multi_gpu: false
gpus: [0]
seed: 123456
model: recognize_model

# Dataset geometry and source convention
dataset: iam_word
dataset_source_polarity: white
img_height: 64

training:
  # Data and initialization
  dset_name: iam_word
  dset_split: trnval
  resume: ''
  pretrained_backbone: ''

  # Batches and data loading
  batch_size: 128
  sort_input: true

  # Optimizers and update cadence
  lr: 0.001

  # Epoch schedule
  epochs: 100
  lr_policy: linear
  start_decay_epoch: 60
  n_epochs_decay: 40

  # Exponential moving averages
  teacher_ema: true
  teacher_ema_beta: 0.999

  # Text sampling
  n_class: 81

  # Augmentation and regularization
  augment: true

  # Logging, evaluation, saving and exports
  print_iter_val: 20
  eval_epoch_val: 10
  ckpt_dir: ckpts
  export_recognizer: ./pretrained/ocr_iam_train64.pth

valid:
  # Dataset and metric switches
  dset_name: iam_word
  dset_split: test

  # Feature extraction and sampling
  batch_size: 256
  n_class: 81

OcrModel:
  resolution: 16
  max_dim: 256
  in_channel: 1
  norm: bn
  init: none
  dropout: 0.2
  n_class: 81
  rnn_depth: 2
  bidirectional: true
