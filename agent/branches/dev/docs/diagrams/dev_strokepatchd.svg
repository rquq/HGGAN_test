<rect width="2040" height="1130" fill="#FFFFFF"/>
<text x="42" y="54" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="30" font-weight="600" fill="#172033"><tspan x="42" dy="0">DEV StrokePatchD</tspan></text>
<text x="42" y="86" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" font-weight="400" fill="#526078"><tspan x="42" dy="0">Matched adaptive 32×32 crops and the lightweight stroke-specialized local critic. Global D is omitted.</tspan></text>
