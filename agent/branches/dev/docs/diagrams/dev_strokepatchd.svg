<text x="60" y="192" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="400" fill="#526078"><tspan x="60" dy="0">real word</tspan><tspan x="60" dy="21">augmented real</tspan><tspan x="60" dy="21">random fake</tspan><tspan x="60" dy="21">style-transfer fake</tspan><tspan x="60" dy="21">reconstruction fake</tspan></text>
<rect x="335" y="132" width="310" height="202" rx="14" fill="#DCFCE7" stroke="#16A34A" stroke-width="1.5" filter="url(#soft-shadow)"/>
<text x="353" y="162" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="600" fill="#172033"><tspan x="353" dy="0">Matched adaptive sampler</tspan></text>
<text x="353" y="189" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="400" fill="#526078"><tspan x="353" dy="0">patch size = 32×32</tspan><tspan x="353" dy="21">count = ceil(valid_width/32)</tspan><tspan x="353" dy="21">clamped to 4–8 per image</tspan><tspan x="353" dy="21">stratified horizontal coverage</tspan><tspan x="353" dy="21">alternating upper/lower bands</tspan></text>
<rect x="695" y="150" width="238" height="166" rx="14" fill="#DCFCE7" stroke="#16A34A" stroke-width="1.5" filter="url(#soft-shadow)"/>
<text x="713" y="180" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="600" fill="#172033"><tspan x="713" dy="0">Optional local mask</tspan></text>
<text x="713" y="207" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="400" fill="#526078"><tspan x="713" dy="0">masking_mode = combined</tspan><tspan x="713" dy="21">light patch-only occlusion</tspan><tspan x="713" dy="21">never applied to style input</tspan></text>
<rect x="980" y="165" width="180" height="134" rx="14" fill="#F3E8FF" stroke="#9333EA" stroke-width="1.5" filter="url(#soft-shadow)"/>
