<svg xmlns="http://www.w3.org/2000/svg" width="2040" height="1130" viewBox="0 0 2040 1130" role="img" aria-labelledby="diagram-title diagram-desc">
<title id="diagram-title">DEV StrokePatchD</title>
<desc id="diagram-desc">Matched adaptive 32×32 crops and the lightweight stroke-specialized local critic. Global D is omitted.</desc>
