<text x="1410" y="248" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="400" fill="#526078"><tspan x="1410" dy="0">32 → 64</tspan><tspan x="1410" dy="21">32² → 16²</tspan></text>
