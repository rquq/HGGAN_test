<text x="1220" y="169" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="400" fill="#526078"><tspan x="1220" dy="0">Spectral normalization is used on every convolution.</tspan></text>
