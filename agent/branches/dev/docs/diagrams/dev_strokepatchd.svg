<text x="1596" y="248" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="400" fill="#526078"><tspan x="1596" dy="0">64 → 128</tspan><tspan x="1596" dy="21">16² → 8²</tspan></text>
