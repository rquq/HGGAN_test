<text x="692" y="412" font-family="DejaVu Sans, Arial, sans-serif" font-size="16" font-weight="400" fill="#293440" text-anchor="start">Local depthwise mixing</text>
<text x="660" y="452" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" font-weight="600" fill="#ad6688" text-anchor="start">3</text>
<text x="692" y="452" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" font-weight="400" fill="#293440" text-anchor="start">Character-aware</text>
<text x="692" y="476" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" font-weight="400" fill="#293440" text-anchor="start">allograph refinement</text>
