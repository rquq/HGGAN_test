<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1220 570" role="img">
<rect width="100%" height="100%" fill="white"/>
<rect x="25" y="45" width="190" height="75" rx="5" fill="#f1f3f5" stroke="#263746" stroke-width="1.4"/>
<text x="120.0" y="72.6" dominant-baseline="middle" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-size="15" fill="#263746">Valid word image</text>
<text x="120.0" y="92.4" dominant-baseline="middle" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-size="15" fill="#263746">H × W; square s=H/2</text>
<rect x="265" y="45" width="240" height="75" rx="5" fill="#e8f0f8" stroke="#263746" stroke-width="1.4"/>
<text x="385.0" y="65.46774193548387" dominant-baseline="middle" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-size="12.90322580645161" fill="#263746">Geometry-only sampling</text>
<text x="385.0" y="82.5" dominant-baseline="middle" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-size="12.90322580645161" fill="#263746">K = clamp(ceil(W/s),4,8)</text>
<text x="385.0" y="99.53225806451613" dominant-baseline="middle" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-size="12.90322580645161" fill="#263746">horizontal strata + two y bands</text>
<rect x="555" y="45" width="180" height="75" rx="5" fill="#e6f3ee" stroke="#263746" stroke-width="1.4"/>
<text x="645.0" y="62.7" dominant-baseline="middle" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-size="15" fill="#263746">K crops per word</text>
<text x="645.0" y="82.5" dominant-baseline="middle" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-size="15" fill="#263746">32px → 16×16</text>
<text x="645.0" y="102.3" dominant-baseline="middle" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-size="15" fill="#263746">64px → 32×32</text>
<rect x="785" y="45" width="180" height="75" rx="5" fill="#e8f0f8" stroke="#263746" stroke-width="1.4"/>
<text x="875.0" y="72.6" dominant-baseline="middle" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-size="15" fill="#263746">3×3 stem</text>
<text x="875.0" y="92.4" dominant-baseline="middle" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-size="15" fill="#263746">1→64 channels</text>
<polyline points="215,82 265,82" fill="none" stroke="#263746" stroke-width="1.6"/>
<polygon points="265,82 257.0,78.0 257.0,86.0" fill="#263746"/>
<polyline points="505,82 555,82" fill="none" stroke="#263746" stroke-width="1.6"/>
<polygon points="555,82 547.0,78.0 547.0,86.0" fill="#263746"/>
<polyline points="735,82 785,82" fill="none" stroke="#263746" stroke-width="1.6"/>
<polygon points="785,82 777.0,78.0 777.0,86.0" fill="#263746"/>
<rect x="265" y="235" width="250" height="90" rx="5" fill="#e6f3ee" stroke="#263746" stroke-width="1.4"/>
<text x="390.0" y="262.2073732718894" dominant-baseline="middle" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-size="13.479262672811057" fill="#263746">StrokePatchBlock ×3</text>
<text x="390.0" y="280.0" dominant-baseline="middle" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-size="13.479262672811057" fill="#263746">channels 128 → 192 → 192</text>
<text x="390.0" y="297.7926267281106" dominant-baseline="middle" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-size="13.479262672811057" fill="#263746">shared minimum spatial grid 4×4</text>
<polyline points="875,120 875,185 390,185 390,235" fill="none" stroke="#263746" stroke-width="1.6"/>
<polygon points="390,235 394.0,227.0 386.0,227.0" fill="#263746"/>
<rect x="565" y="235" width="220" height="90" rx="5" fill="#f1f3f5" stroke="#263746" stroke-width="1.4"/>
<text x="675.0" y="262.8265306122449" dominant-baseline="middle" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-size="13.010204081632653" fill="#263746">Block anatomy (inset)</text>
<text x="675.0" y="280.0" dominant-baseline="middle" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-size="13.010204081632653" fill="#263746">3×3 conv + (DW 1×5 + DW 5×1)</text>
<text x="675.0" y="297.1734693877551" dominant-baseline="middle" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-size="13.010204081632653" fill="#263746">1×1 fuse + shortcut</text>
<polyline points="515,305 565,305" fill="none" stroke="#263746" stroke-width="1.6" stroke-dasharray="6 4"/>
<polygon points="565,305 557.0,301.0 557.0,309.0" fill="#263746"/>
<rect x="835" y="235" width="220" height="90" rx="5" fill="#f9e9e5" stroke="#263746" stroke-width="1.4"/>
<text x="945.0" y="270.3828571428571" dominant-baseline="middle" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-size="14.57142857142857" fill="#263746">1×1 spatial logit head</text>
<text x="945.0" y="289.6171428571429" dominant-baseline="middle" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-size="14.57142857142857" fill="#263746">no early global averaging</text>
<polyline points="515,255 535,255 535,210 945,210 945,235" fill="none" stroke="#263746" stroke-width="1.6"/>
<polygon points="945,235 949.0,227.0 941.0,227.0" fill="#263746"/>
<rect x="565" y="410" width="490" height="80" rx="5" fill="#fff2d6" stroke="#263746" stroke-width="1.4"/>
<text x="810.0" y="432.5424107142857" dominant-baseline="middle" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-size="13.225446428571427" fill="#263746">D phase: hinge per spatial decision → mean map → mean crops/word</text>
<text x="810.0" y="450.0" dominant-baseline="middle" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-size="13.225446428571427" fill="#263746">G phase: negative score → same per-word aggregation</text>
<text x="810.0" y="467.4575892857143" dominant-baseline="middle" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-size="13.225446428571427" fill="#263746">Then average branches equally, not by crop count</text>
<polyline points="945,325 945,410" fill="none" stroke="#263746" stroke-width="1.6"/>
<polygon points="945,410 949.0,402.0 941.0,402.0" fill="#263746"/>
<text x="25" y="535" text-anchor="start" font-family="Arial,DejaVu Sans,sans-serif" font-size="14" fill="#263746">Real, random fake, transferred fake and reconstruction use the same sampling policy; coordinates are sampled independently.</text>
</svg>