visible; text-align: left;" pointer-events="none" width="100%" height="100%" requiredFeatures="http://www.w3.org/TR/SVG11/feature#Extensibility"><div xmlns="http://www.w3.org/1999/xhtml" style="display: flex; align-items: unsafe center; justify-content: unsafe flex-start; width: 1474px; height: 1px; padding-top: 905px; margin-left: 16px;"><div style="box-sizing: border-box; font-size: 0; text-align: left; max-height: 34px; overflow: hidden; color: #202020; "><div style="display: inline-block; font-size: 19px; font-family: Arial; color: light-dark(#202020, #d2d2d2); line-height: 1.2; pointer-events: all; font-weight: bold; white-space: normal; word-wrap: normal; ">Forward flow and supervision</div></div></div></foreignObject><text x="16" y="911" fill="#202020" font-family="Arial" font-size="19px" font-weight="bold" style="fill: light-dark(rgb(32, 32, 32), rgb(210, 210, 210));">Forward flow and supervision</text></switch></g></g></g><g data-cell-id="explanation-1"><g><rect x="16" y="930" width="1472" height="54" fill="none" stroke="none" pointer-events="all"/></g><g><g><switch><foreignObject style="overflow: visible; text-align: left;" pointer-events="none" width="100%" height="100%" requiredFeatures="http://www.w3.org/TR/SVG11/feature#Extensibility"><div xmlns="http://www.w3.org/1999/xhtml" style="display: flex; align-items: unsafe center; justify-content: unsafe flex-start; width: 1474px; height: 1px; padding-top: 957px; margin-left: 16px;"><div style="box-sizing: border-box; font-size: 0; text-align: left; max-height: 54px; overflow: hidden; color: #202020; "><div style="display: inline-block; font-size: 16px; font-family: Arial; color: light-dark(#202020, #d2d2d2); line-height: 1.2; pointer-events: all; white-space: normal; word-wrap: normal; ">The same G generates random, reference-transfer and reconstruction words in one batched forward. D sees all three; R sees only random/transfer; W+B sees only transfer. The reference and canonical target x may have different widths.</div></div></div></foreignObject><text x="16" y="952" fill="#202020" font-family="Arial" font-size="16px" style="fill: light-dark(rgb(32, 32, 32), rgb(210, 210, 210));"><tspan x="16" y="952">The same G generates random, reference-transfer and reconstruction words in one batched forward. D sees all three; R sees only random/transfer; W+B sees only transfer. The reference and canonical target</tspan><tspan x="16" y="971">x may have different widths.</tspan></text></switch></g></g></g><g data-cell-id="explanation-2"><g><rect x="16" y="992" width="1472" height="35" fill="none" stroke="none" pointer-events="all"/></g><g><g><switch><foreignObject style="overflow: visible; text-align: left;" pointer-events="none" width="100%" height="100%" requiredFeatures="http://www.w3.org/TR/SVG11/feature#Extensibility"><div xmlns="http://www.w3.org/1999/xhtml" style="display: flex; align-items: unsafe center; justify-content: unsafe flex-start; width: 1474px; height: 1px; padding-top: 1010px; margin-left: 16px;"><div style="box-sizing: border-box; font-size: 0; text-align: left; max-height: 35px; overflow: hidden; color: #202020; "><div style="display: inline-block; font-size: 19px; font-family: 'Times New Roman'; color: light-dark(#202020, #d2d2d2); line-height: 1.2; pointer-events: all; white-space: normal; word-wrap: normal; ">L<sub>D</sub> = E[(1 − D(x))₊] + (1/3) ∑<sub>b</sub> E[(1 + D(stop(x<sub>b</sub>)))₊] + L<sub>R1</sub>,    b ∈ {rand, style, rec}.</div></div></div></foreignObject><text x="16" y="1015" fill="#202020" font-family="'Times New Roman'" font-size="19px" style="fill: light-dark(rgb(32, 32, 32), rgb(210, 210, 210));">LD = E[(1 − D(x))₊] + (1/3) ∑b E[(1 + D(stop(xb)))₊] + LR1, b ∈ {rand, style, rec}.</text></switch></g></g></g><g data-cell-id="explanation-3"><g><rect x="16" y="1035" width="1472" height="35" fill="none" stroke="none" pointer-events="all"/></g><g><g><switch><foreignObject style="overflow: visible; text-align: left;" pointer-events="none" width="100%" height="100%" requiredFeatures="http://www.w3.org/TR/SVG11/feature#Extensibility"><div xmlns="http://www.w3.org/1999/xhtml" style="display: flex; align-items: unsafe center; justify-content: unsafe flex-start; width: 1474px; height: 1px; padding-top: 1053px; margin-left: 16px;"><div style="box-sizing: border-box; font-size: 0; text-align: left; max-height: 35px; overflow: hidden; color: #202020; "><div style="display: inline-block; font-size: 19px; font-family: 'Times New Roman'; color: light-dark(#202020, #d2d2d2); line-height: 1.2; pointer-events: all; white-space: normal; word-wrap: normal; ">L<sub>adv</sub> = −(1/3) ∑<sub>b</sub> E[D(x<sub>b</sub>)];    L<sub>CTC</sub> = λ<sub>r</sub> CTC(R(x<sub>rand</sub>), y′) + λ<sub>s</sub> CTC(R(x<sub>style</sub>), y′);    L<sub>writer</sub> = CE(W(B(x<sub>style</sub>)), w).</div></div></div></foreignObject><text x="16" y="1058" fill="#202020" font-family="'Times New Roman'" font-size="19px" style="fill: light-dark(rgb(32, 32, 32), rgb(210, 210, 210));">Ladv = −(1/3) ∑b E[D(xb)]; LCTC = λr CTC(R(xrand), y′) + λs CTC(R(xstyle), y′); Lwriter = CE(W(B(xstyle)), w).</text></switch></g></g></g><g data-cell-id="explanation-4"><g><rect x="16" y="1078" width="1472" height="35" fill="none" stroke="none" pointer-events="all"/></g><g><g><switch><foreignObject style="overflow: visible; text-align: left;" pointer-events="none" width="100%" height="100%" requiredFeatures="http://www.w3.org/TR/SVG11/feature#Extensibility"><div xmlns="http://www.w3.org/1999/xhtml" style="display: flex; align-items: unsafe center; justify-content: unsafe flex-start; width: 1474px; height: 1px; padding-top: 1096px; margin-left: 16px;"><div style="box-sizing: border-box; font-size: 0; text-align: left; max-height: 35px; overflow: hidden; color: #202020; "><div style="display: inline-block; font-size: 19px; font-family: 'Times New Roman'; color: light-dark(#202020, #d2d2d2); line-height: 1.2; pointer-events: all; white-space: normal; word-wrap: normal; ">L<sub>G,E</sub> = L<sub>adv</sub> + 0.45 L<sub>adv,P</sub> + L<sub>CTC</sub> + 0.5 L<sub>writer</sub> + λ<sub>rec</sub> L<sub>rec</sub> + L<sub>info</sub> + L<sub>cycle</sub> + 0.02 L<sub>content</sub> + 0.1 L<sub>ctx</sub> + 0.1 L<sub>KL</sub>.</div></div></div></foreignObject><text x="16" y="1101" fill="#202020" font-family="'Times New Roman'" font-size="19px" style="fill: light-dark(rgb(32, 32, 32), rgb(210, 210, 210));">LG,E = Ladv + 0.45 Ladv,P + LCTC + 0.5 Lwriter + λrec Lrec + Linfo + Lcycle + 0.02 Lcontent + 0.1 Lctx + 0.1 LKL.</text></switch></g></g></g><g data-cell-id="explanation-5"><g><rect x="16" y="1121" width="1472" height="54" fill="none" stroke="none" pointer-events="all"/></g><g><g><switch><foreignObject style="overflow: visible; text-align: left;" pointer-events="none" width="100%" height="100%" requiredFeatures="http://www.w3.org/TR/SVG11/feature#Extensibility"><div xmlns="http://www.w3.org/1999/xhtml" style="display: flex; align-items: unsafe center; justify-content: unsafe flex-start; width: 1474px; height: 1px; padding-top: 1148px; margin-left: 16px;"><div style="box-sizing: border-box; font-size: 0; text-align: left; max-height: 54px; overflow: hidden; color: #202020; "><div style="display: inline-block; font-size: 16px; font-family: Arial; color: light-dark(#202020, #d2d2d2); line-height: 1.2; pointer-events: all; white-space: normal; word-wrap: normal; ">D/P update every batch; G/E update every second critic batch. In the G/E phase, D/P/B/R/W parameters are frozen but input gradients remain. R and W+B are pretrained on real images; W+B starts from the OCR CNN. See (b)/(c) for the other losses.</div></div></div></foreignObject><text x="16" y="1143" fill="#202020" font-family="Arial" font-size="16px" style="fill: light-dark(rgb(32, 32, 32), rgb(210, 210, 210));"><tspan x="16" y="1143">D/P update every batch; G/E update every second critic batch. In the G/E phase, D/P/B/R/W parameters are frozen but input gradients remain. R and W+B are pretrained on real images; W+B starts from the</tspan><tspan x="16" y="1162">OCR CNN. See (b)/(c) for the other losses.</tspan></text></switch></g></g></g><g data-cell-id="explanation-6"><g><rect x="16" y="1183" width="1472" height="54" fill="none" stroke="none" pointer-events="all"/></g><g><g><switch><foreignObject style="overflow: visible; text-align: left;" pointer-events="none" width="100%" height="100%" requiredFeatures="http://www.w3.org/TR/SVG11/feature#Extensibility"><div xmlns="http://www.w3.org/1999/xhtml" style="display: flex; align-items: unsafe center; justify-content: unsafe flex-start; width: 1474px; height: 1px; padding-top: 1210px; margin-left: 16px;"><div style="box-sizing: border-box; font-size: 0; text-align: left; max-height: 54px; overflow: hidden; color: #202020; "><div style="display: inline-block; font-size: 16px; font-family: Arial; color: light-dark(#202020, #d2d2d2); line-height: 1.2; pointer-events: all; white-space: normal; word-wrap: normal; ">Normal config: λ_r 1→0.4 (epochs 10–20), λ_s 0.5→0.20 (8–28), λ_rec 10→2.5 (24–42). Lazy R1 = (0.01 × 32 / 2) E||∇_x D(x)||² every 32 critic batches. D includes the same mild differentiable augmentation policy for real and fake.</div></div></div></foreignObject><text x="16" y="1205" fill="#202020" font-family="Arial" font-size="16px" style="fill: light-dark(rgb(32, 32, 32), rgb(210, 210, 210));"><tspan x="16" y="1205">Normal config: λ_r 1→0.4 (epochs 10–20), λ_s 0.5→0.20 (8–28), λ_rec 10→2.5 (24–42). Lazy R1 = (0.01 × 32 / 2) E||∇_x D(x)||² every 32 critic batches. D includes the same mild differentiable augmentation</tspan><tspan x="16" y="1224">policy for real and fake.</tspan></text></switch></g></g></g></g></g></g><switch><g requiredFeatures="http://www.w3.org/TR/SVG11/feature#Extensibility"/></switch></svg></div></section><section id="p1"><div class="diagram-container"><svg xmlns="http://www.w3.org/2000/svg" style="background: #ffffff; background-color: light-dark(#ffffff, #121212);" xmlns:xli VG11/feature#Extensibility"><div xmlns="http://www.w3.org/1999/xhtml" style="display: flex; align-items: unsafe center; justify-content: unsafe flex-start; width: 1474px; height: 1px; padding-top: 957px; margin-left: 16px;"><div style="box-sizing: border-box; font-size: 0; text-align: left; max-height: 54px; overflow: hidden; color: #202020; "><div style="display: inline-block; font-size: 16px; font-family: Arial; color: light-dark(#202020, #d2d2d2); line-height: 1.2; pointer-events: all; white-space: normal; word-wrap: normal; ">Pixel L1 compares x_rec to the canonical real image x over valid pixels, not to the original-width style reference. Global information recovery reconstructs the prior z_g; transfer cycle recovers the reference global mean. These are separate targets, not three copies of one loss.</div></div></div></foreignObject><text x="16" y="952" fill="#202020" font-family="Arial" font-size="16px" style="fill: light-dark(rgb(32, 32, 32), rgb(210, 210, 210));"><tspan x="16" y="952">Pixel L1 compares x_rec to the canonical real image x over valid pixels, not to the original-width style reference. Global information recovery reconstructs the prior z_g; transfer cycle recovers the reference</tspan><tspan x="16" y="971">global mean. These are separate targets, not three copies of one loss.</tspan></text></switch></g></g></g><g data-cell-id="explanation-2"><g><rect x="16" y="992" width="1472" height="35" fill="none" stroke="none" pointer-events="all"/></g><g><g><switch><foreignObject style="overflow: visible; text-align: left;" pointer-events="none" width="100%" height="100%" requiredFeatures="http://www.w3.org/TR/SVG11/feature#Extensibility"><div xmlns="http://www.w3.org/1999/xhtml" style="display: flex; align-items: unsafe center; justify-content: unsafe flex-start; width: 1474px; height: 1px; padding-top: 1010px; margin-left: 16px;"><div style="box-sizing: border-box; font-size: 0; text-align: left; max-height: 35px; overflow: hidden; color: #202020; "><div style="display: inline-block; font-size: 19px; font-family: 'Times New Roman'; color: light-dark(#202020, #d2d2d2); line-height: 1.2; pointer-events: all; white-space: normal; word-wrap: normal; ">L<sub>rec</sub> = mean<sub>valid</sub> |x<sub>rec</sub> − x|;    L<sub>info</sub> = mean |E<sub>g</sub>(B(x<sub>rand</sub>)) − stop(z<sub>g</sub>)| / 8;    L<sub>cycle</sub> = mean |E<sub>g</sub>(B(x<sub>style</sub>)) − stop(μ<sub>g,ref</sub>)| / 8.</div></div></div></foreignObject><text x="16" y="1015" fill="#202020" font-family="'Times New Roman'" font-size="19px" style="fill: light-dark(rgb(32, 32, 32), rgb(210, 210, 210));">Lrec = meanvalid |xrec − x|; Linfo = mean |Eg(B(xrand)) − stop(zg)| / 8; Lcycle = mean |Eg(B(xstyle)) − stop(μg,ref)| / 8.</text></switch></g></g></g><g data-cell-id="explanation-3"><g><rect x="16" y="1035" width="1472" height="35" fill="none" stroke="none" pointer-events="all"/></g><g><g><switch><foreignObject style="overflow: visible; text-align: left;" pointer-events="none" width="100%" height="100%" requiredFeatures="http://www.w3.org/TR/SVG11/feature#Extensibility"><div xmlns="http://www.w3.org/1999/xhtml" style="display: flex; align-items: unsafe center; justify-content: unsafe flex-start; width: 1474px; height: 1px; padding-top: 1053px; margin-left: 16px;"><div style="box-sizing: border-box; font-size: 0; text-align: left; max-height: 35px; overflow: hidden; color: #202020; "><div style="display: inline-block; font-size: 19px; font-family: 'Times New Roman'; color: light-dark(#202020, #d2d2d2); line-height: 1.2; pointer-events: all; white-space: normal; word-wrap: normal; ">L<sub>KL</sub> = KL[N(μ<sub>g</sub>, diag(exp(ℓ<sub>g</sub>))) || N(0,I)] / 8;    g = μ<sub>g</sub> + exp(0.5 ℓ<sub>g</sub>) ⊙ ε;    ε ∼ N(0,I);    ℓ<sub>g</sub> = log σ<sub>g</sub>².</div></div></div></foreignObject><text x="16" y="1058" fill="#202020" font-family="'Times New Roman'" font-size="19px" style="fill: light-dark(rgb(32, 32, 32), rgb(210, 210, 210));">LKL = KL[N(μg, diag(exp(ℓg))) || N(0,I)] / 8; g = μg + exp(0.5 ℓg) ⊙ ε; ε ∼ N(0,I); ℓg = log σg².</text></switch></g></g></g><g data-cell-id="explanation-4"><g><rect x="16" y="1078" width="1472" height="35" fill="none" stroke="none" pointer-events="all"/></g><g><g><switch><foreignObject style="overflow: visible; text-align: left;" pointer-events="none" width="100%" height="100%" requiredFeatures="http://www.w3.org/TR/SVG11/feature#Extensibility"><div xmlns="http://www.w3.org/1999/xhtml" style="display: flex; align-items: unsafe center; justify-content: unsafe flex-start; width: 1474px; height: 1px; padding-top: 1096px; margin-left: 16px;"><div style="box-sizing: border-box; font-size: 0; text-align: left; max-height: 35px; overflow: hidden; color: #202020; "><div style="display: inline-block; font-size: 19px; font-family: 'Times New Roman'; color: light-dark(#202020, #d2d2d2); line-height: 1.2; pointer-events: all; white-space: normal; word-wrap: normal; ">L<sub>content</sub> = balanced-BCE(Probe(GRL(μ<sub>g,ref</sub>)), bag(y)) / 8;    GRL is identity forward and reverses only the gradient toward E.</div></div></div></foreignObject><text x="16" y="1101" fill="#202020" font-family="'Times New Roman'" font-size="19px" style="fill: light-dark(rgb(32, 32, 32), rgb(210, 210, 210));">Lcontent = balanced-BCE(Probe(GRL(μg,ref)), bag(y)) / 8; GRL is identity forward and reverses only the gradient toward E.</text></switch></g></g></g><g data-cell-id="explanation-5"><g><rect x="16" y="1121" width="1472" height="54" fill="none" stroke="none" pointer-events="all"/></g><g><g><switch><foreignObject style="overflow: visible; text-align: left;" pointer-events="none" width="100%" height="100%" requiredFeatures="http://www.w3.org/TR/SVG11/feature#Extensibility"><div xmlns="http://www.w3.org/1999/xhtml" style="display: flex; align-items: unsafe center; justify-content: unsafe flex-start; width: 1474px; height: 1px; padding-top: 1148px; margin-left: 16px;"><div style="box-sizing: border-box; font-size: 0; text-align: left; max-height: 54px; overflow: hidden; color: #202020; "><div style="display: inline-block; font-size: 16px; font-family: Arial; color: light-dark(#202020, #d2d2d2); line-height: 1.2; pointer-events: all; white-space: normal; word-wrap: normal; ">The probe learns reference character presence while E is pushed to hide it in g. Local L is a deterministic, centered 7-token residual; it is neither KL-regularized nor reconstructed against random local slots. E_g skips local retrieval. All repeated B/E/G blocks share weights.</div></div></div></foreignObject><text x="16" y="1143" fill="#202020" font-family="Arial" font-size="16px" style="fill: light-dark(rgb(32, 32, 32), rgb(210, 210, 210));"><tspan x="16" y="1143">The probe learns reference character presence while E is pushed to hide it in g. Local L is a deterministic, centered 7-token residual; it is neither KL-regularized nor reconstructed against random local slots.</tspan><tspan x="16" y="1162">E_g skips local retrieval. All repeated B/E/G blocks share weights.</tspan></text></switch></g></g></g><g data-cell-id="explanation-6"><g><rect x="16" y="1183" width="1472" height="54" fill="none" stroke="none" pointer-events="all"/></g><g><g><switch><foreignObject style="overflow: visible; text-align: left;" pointer-events="none" width="100%" height="100%" requiredFeatures="http://www.w3.org/TR/SVG11/feature#Extensibility"><div xmlns="http://www.w3.org/1999/xhtml" style="display: flex; align-items: unsafe center; justify-content: unsafe flex-start; width: 1474px; height: 1px; padding-top: 1210px; margin-left: 16px;"><div style="box-sizing: border-box; font-size: 0; text-align: left; max-height: 54px; overflow: hidden; color: #202020; "><div style="display: inline-block; font-size: 16px; font-family: Arial; color: light-dark(#202020, #d2d2d2); line-height: 1.2; pointer-events: all; white-space: normal; word-wrap: normal; ">These three generated branches also receive the global and patch adversarial losses in (a)/(c). Only x_rand and x_style receive OCR CTC. The /8 factors preserve the explicit eight-token normalization implemented in the current loss functions.</div></div></div></foreignObject><text x="16" y="1205" fill="#202020" font-family="Arial" font-size="16px" style="fill: light-dark(rgb(32, 32, 32), rgb(210, 210, 210));"><tspan x="16" y="1205">These three generated branches also receive the global and patch adversarial losses in (a)/(c). Only x_rand and x_style receive OCR CTC. The /8 factors preserve the explicit eight-token normalization</tspan><tspan x="16" y="1224">implemented in the current loss functions.</tspan></text></switch></g></g></g></g></g></g><switch><g requiredFeatures="http://www.w3.org/TR/SVG11/feature#Extensibility"/></switch></svg></div></section><section id="p2"><div class="diagram-container"><svg xmlns="http://www.w3.org/2000/svg" style="background: #ffffff; background-color: light-dark(#ffffff, #121212);" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" width="1504px" height="1436px" viewBox="0 0 1504 1436" role="img" aria-labelledby="panel-2-title panel-2-desc"><title id="panel-2-title">(c) Local refinement</title><desc id="panel-2-desc">End-to-end ALPHA flow, with exact explanation and objective formulas beneath the diagram.</desc><defs/><rect fill="#ffffff" width="100%" height="100%" x="0" y="0" style="fill: light-dark(rgb(255, 255, 255), rgb(18, 18, 18));"/><g><g data-cell-id="0"><g data-cell-id="zones"><g data-cell-id="paper-panel"><g><rect x="0" y="96" width="1504" height="744" fill="#dceef3" stroke="none" pointer-events="all" style="fill: light-dark(rgb(220, 238, 243), rgb(22, 38, 42));"/></g></g></g><g data-cell-id="edges"><g data-cell-id="edge-0"><g><path d="M 200 536 L 226 536 Q 236 536 236 534 L 236 533 Q 236 532 241.31 532 L 246.61 532" fill="none" stroke="#263746" stroke-width="1.6" stroke-miterlimit="10" pointer-events="stroke" style="stroke: light-dark(rgb(38, 55, 70), rgb(180, 194, 207));"/><path d="M 254 isplay: flex; align-items: unsafe center; justify-content: unsafe flex-start; width: 1474px; height: 1px; padding-top: 957px; margin-left: 16px;"><div style="box-sizing: border-box; font-size: 0; text-align: left; max-height: 54px; overflow: hidden; color: #202020; "><div style="display: inline-block; font-size: 16px; font-family: Arial; color: light-dark(#202020, #d2d2d2); line-height: 1.2; pointer-events: all; white-space: normal; word-wrap: normal; ">Crop side s = H/2 (16 at H32, 32 at H64). Horizontal start positions are stratified; vertical locations alternate upper/lower halves. Real and all fake branches use the same policy, not identical coordinates. Only P receives these crops; global D always receives complete words.</div></div></div></foreignObject><text x="16" y="952" fill="#202020" font-family="Arial" font-size="16px" style="fill: light-dark(rgb(32, 32, 32), rgb(210, 210, 210));"><tspan x="16" y="952">Crop side s = H/2 (16 at H32, 32 at H64). Horizontal start positions are stratified; vertical locations alternate upper/lower halves. Real and all fake branches use the same policy, not identical coordinates. Only</tspan><tspan x="16" y="971">P receives these crops; global D always receives complete words.</tspan></text></switch></g></g></g><g data-cell-id="explanation-2"><g><rect x="16" y="992" width="1472" height="35" fill="none" stroke="none" pointer-events="all"/></g><g><g><switch><foreignObject style="overflow: visible; text-align: left;" pointer-events="none" width="100%" height="100%" requiredFeatures="http://www.w3.org/TR/SVG11/feature#Extensibility"><div xmlns="http://www.w3.org/1999/xhtml" style="display: flex; align-items: unsafe center; justify-content: unsafe flex-start; width: 1474px; height: 1px; padding-top: 1010px; margin-left: 16px;"><div style="box-sizing: border-box; font-size: 0; text-align: left; max-height: 35px; overflow: hidden; color: #202020; "><div style="display: inline-block; font-size: 19px; font-family: 'Times New Roman'; color: light-dark(#202020, #d2d2d2); line-height: 1.2; pointer-events: all; white-space: normal; word-wrap: normal; ">K<sub>n</sub> = clamp(ceil(W<sub>n</sub> / (H/2)), 4, 8);    L<sub>P</sub> = HingeMap(P(C(x)), +1) + (1/3) ∑<sub>b</sub> HingeMap(P(C(stop(x<sub>b</sub>))), −1).</div></div></div></foreignObject><text x="16" y="1015" fill="#202020" font-family="'Times New Roman'" font-size="19px" style="fill: light-dark(rgb(32, 32, 32), rgb(210, 210, 210));">Kn = clamp(ceil(Wn / (H/2)), 4, 8); LP = HingeMap(P(C(x)), +1) + (1/3) ∑b HingeMap(P(C(stop(xb))), −1).</text></switch></g></g></g><g data-cell-id="explanation-3"><g><rect x="16" y="1035" width="1472" height="35" fill="none" stroke="none" pointer-events="all"/></g><g><g><switch><foreignObject style="overflow: visible; text-align: left;" pointer-events="none" width="100%" height="100%" requiredFeatures="http://www.w3.org/TR/SVG11/feature#Extensibility"><div xmlns="http://www.w3.org/1999/xhtml" style="display: flex; align-items: unsafe center; justify-content: unsafe flex-start; width: 1474px; height: 1px; padding-top: 1053px; margin-left: 16px;"><div style="box-sizing: border-box; font-size: 0; text-align: left; max-height: 35px; overflow: hidden; color: #202020; "><div style="display: inline-block; font-size: 19px; font-family: 'Times New Roman'; color: light-dark(#202020, #d2d2d2); line-height: 1.2; pointer-events: all; white-space: normal; word-wrap: normal; ">L<sub>adv,P</sub> = −(1/3) ∑<sub>b</sub> MeanWord[MeanCrop[MeanMap[P(C(x<sub>b</sub>))]]];    generator contribution = 0.45 L<sub>adv,P</sub>.</div></div></div></foreignObject><text x="16" y="1058" fill="#202020" font-family="'Times New Roman'" font-size="19px" style="fill: light-dark(rgb(32, 32, 32), rgb(210, 210, 210));">Ladv,P = −(1/3) ∑b MeanWord[MeanCrop[MeanMap[P(C(xb))]]]; generator contribution = 0.45 Ladv,P.</text></switch></g></g></g><g data-cell-id="explanation-4"><g><rect x="16" y="1078" width="1472" height="35" fill="none" stroke="none" pointer-events="all"/></g><g><g><switch><foreignObject style="overflow: visible; text-align: left;" pointer-events="none" width="100%" height="100%" requiredFeatures="http://www.w3.org/TR/SVG11/feature#Extensibility"><div xmlns="http://www.w3.org/1999/xhtml" style="display: flex; align-items: unsafe center; justify-content: unsafe flex-start; width: 1474px; height: 1px; padding-top: 1096px; margin-left: 16px;"><div style="box-sizing: border-box; font-size: 0; text-align: left; max-height: 35px; overflow: hidden; color: #202020; "><div style="display: inline-block; font-size: 19px; font-family: 'Times New Roman'; color: light-dark(#202020, #d2d2d2); line-height: 1.2; pointer-events: all; white-space: normal; word-wrap: normal; ">L<sub>ctx</sub> = ∑<sub>l</sub> CX(stop(B<sub>l</sub>(x<sub>ref</sub>)), B<sub>l</sub>(x<sub>style</sub>));    generator contribution = 0.1 L<sub>ctx</sub>;    l ∈ {three selected backbone scales}.</div></div></div></foreignObject><text x="16" y="1101" fill="#202020" font-family="'Times New Roman'" font-size="19px" style="fill: light-dark(rgb(32, 32, 32), rgb(210, 210, 210));">Lctx = ∑l CX(stop(Bl(xref)), Bl(xstyle)); generator contribution = 0.1 Lctx; l ∈ {three selected backbone scales}.</text></switch></g></g></g><g data-cell-id="explanation-5"><g><rect x="16" y="1121" width="1472" height="54" fill="none" stroke="none" pointer-events="all"/></g><g><g><switch><foreignObject style="overflow: visible; text-align: left;" pointer-events="none" width="100%" height="100%" requiredFeatures="http://www.w3.org/TR/SVG11/feature#Extensibility"><div xmlns="http://www.w3.org/1999/xhtml" style="display: flex; align-items: unsafe center; justify-content: unsafe flex-start; width: 1474px; height: 1px; padding-top: 1148px; margin-left: 16px;"><div style="box-sizing: border-box; font-size: 0; text-align: left; max-height: 54px; overflow: hidden; color: #202020; "><div style="display: inline-block; font-size: 16px; font-family: Arial; color: light-dark(#202020, #d2d2d2); line-height: 1.2; pointer-events: all; white-space: normal; word-wrap: normal; ">P: 3×3 stem (1→64) → three residual StrokePatchBlocks (128→192→192; 3×3 plus axial DW 1×5 / 5×1 and 1×1 fusion) → spatial logit head. Pooling preserves a minimum 4×4 grid. Hinge is applied BEFORE map/crop reduction, then each word and fake branch is weighted equally.</div></div></div></foreignObject><text x="16" y="1143" fill="#202020" font-family="Arial" font-size="16px" style="fill: light-dark(rgb(32, 32, 32), rgb(210, 210, 210));"><tspan x="16" y="1143">P: 3×3 stem (1→64) → three residual StrokePatchBlocks (128→192→192; 3×3 plus axial DW 1×5 / 5×1 and 1×1 fusion) → spatial logit head. Pooling preserves a minimum 4×4 grid. Hinge is applied BEFORE</tspan><tspan x="16" y="1162">map/crop reduction, then each word and fake branch is weighted equally.</tspan></text></switch></g></g></g><g data-cell-id="explanation-6"><g><rect x="16" y="1183" width="1472" height="54" fill="none" stroke="none" pointer-events="all"/></g><g><g><switch><foreignObject style="overflow: visible; text-align: left;" pointer-events="none" width="100%" height="100%" requiredFeatures="http://www.w3.org/TR/SVG11/feature#Extensibility"><div xmlns="http://www.w3.org/1999/xhtml" style="display: flex; align-items: unsafe center; justify-content: unsafe flex-start; width: 1474px; height: 1px; padding-top: 1210px; margin-left: 16px;"><div style="box-sizing: border-box; font-size: 0; text-align: left; max-height: 54px; overflow: hidden; color: #202020; "><div style="display: inline-block; font-size: 16px; font-family: Arial; color: light-dark(#202020, #d2d2d2); line-height: 1.2; pointer-events: all; white-space: normal; word-wrap: normal; ">CTX matches non-aligned multiscale writer features to new text, with at most 256 sampled spatial features per comparison. Cached B maps are reused. The context comparison is not a reconstruction pixel target, frequency loss, foreground mask or independent texture-refinement network.</ wrap: normal; ">Random-style forward pass</div></div></div></foreignObject><text x="16" y="911" fill="#202020" font-family="Arial" font-size="19px" font-weight="bold" style="fill: light-dark(rgb(32, 32, 32), rgb(210, 210, 210));">Random-style forward pass</text></switch></g></g></g><g data-cell-id="explanation-1"><g><rect x="16" y="930" width="1472" height="54" fill="none" stroke="none" pointer-events="all"/></g><g><g><switch><foreignObject style="overflow: visible; text-align: left;" pointer-events="none" width="100%" height="100%" requiredFeatures="http://www.w3.org/TR/SVG11/feature#Extensibility"><div xmlns="http://www.w3.org/1999/xhtml" style="display: flex; align-items: unsafe center; justify-content: unsafe flex-start; width: 1474px; height: 1px; padding-top: 957px; margin-left: 16px;"><div style="box-sizing: border-box; font-size: 0; text-align: left; max-height: 54px; overflow: hidden; color: #202020; "><div style="display: inline-block; font-size: 16px; font-family: Arial; color: light-dark(#202020, #d2d2d2); line-height: 1.2; pointer-events: all; white-space: normal; word-wrap: normal; ">Text establishes spatial content before local style is injected. The same style layout is used by random and reference-guided generation: one global token for block-wide conditioning and seven centered local tokens for spatial appearance. No character-specific fallback or single-digit switch is used.</div></div></div></foreignObject><text x="16" y="952" fill="#202020" font-family="Arial" font-size="16px" style="fill: light-dark(rgb(32, 32, 32), rgb(210, 210, 210));"><tspan x="16" y="952">Text establishes spatial content before local style is injected. The same style layout is used by random and reference-guided generation: one global token for block-wide conditioning and seven centered local</tspan><tspan x="16" y="971">tokens for spatial appearance. No character-specific fallback or single-digit switch is used.</tspan></text></switch></g></g></g><g data-cell-id="explanation-2"><g><rect x="16" y="992" width="1472" height="35" fill="none" stroke="none" pointer-events="all"/></g><g><g><switch><foreignObject style="overflow: visible; text-align: left;" pointer-events="none" width="100%" height="100%" requiredFeatures="http://www.w3.org/TR/SVG11/feature#Extensibility"><div xmlns="http://www.w3.org/1999/xhtml" style="display: flex; align-items: unsafe center; justify-content: unsafe flex-start; width: 1474px; height: 1px; padding-top: 1010px; margin-left: 16px;"><div style="box-sizing: border-box; font-size: 0; text-align: left; max-height: 35px; overflow: hidden; color: #202020; "><div style="display: inline-block; font-size: 19px; font-family: 'Times New Roman'; color: light-dark(#202020, #d2d2d2); line-height: 1.2; pointer-events: all; white-space: normal; word-wrap: normal; ">z<sub>g</sub> ∼ N(0, I<sub>32</sub>);    Z<sub>L</sub> ∼ N(0, I) with shape 7 × 32;    L<sub>j</sub> = Z<sub>L,j</sub> − (1/7) ∑<sub>k</sub> Z<sub>L,k</sub>;    x<sub>rand</sub> = G([z<sub>g</sub>,L], y′).</div></div></div></foreignObject><text x="16" y="1015" fill="#202020" font-family="'Times New Roman'" font-size="19px" style="fill: light-dark(rgb(32, 32, 32), rgb(210, 210, 210));">zg ∼ N(0, I32); ZL ∼ N(0, I) with shape 7 × 32; Lj = ZL,j − (1/7) ∑k ZL,k; xrand = G([zg,L], y′).</text></switch></g></g></g><g data-cell-id="explanation-3"><g><rect x="16" y="1035" width="1472" height="35" fill="none" stroke="none" pointer-events="all"/></g><g><g><switch><foreignObject style="overflow: visible; text-align: left;" pointer-events="none" width="100%" height="100%" requiredFeatures="http://www.w3.org/TR/SVG11/feature#Extensibility"><div xmlns="http://www.w3.org/1999/xhtml" style="display: flex; align-items: unsafe center; justify-content: unsafe flex-start; width: 1474px; height: 1px; padding-top: 1053px; margin-left: 16px;"><div style="box-sizing: border-box; font-size: 0; text-align: left; max-height: 35px; overflow: hidden; color: #202020; "><div style="display: inline-block; font-size: 19px; font-family: 'Times New Roman'; color: light-dark(#202020, #d2d2d2); line-height: 1.2; pointer-events: all; white-space: normal; word-wrap: normal; ">Spatial refinement: Q = W<sub>Q</sub> LN(F);    K = W<sub>K</sub> LN(L);    V = W<sub>V</sub> L;    F<sub>out</sub> = F + α ⊙ W<sub>O</sub> Attention(Q,K,V).</div></div></div></foreignObject><text x="16" y="1058" fill="#202020" font-family="'Times New Roman'" font-size="19px" style="fill: light-dark(rgb(32, 32, 32), rgb(210, 210, 210));">Spatial refinement: Q = WQ LN(F); K = WK LN(L); V = WV L; Fout = F + α ⊙ WO Attention(Q,K,V).</text></switch></g></g></g><g data-cell-id="explanation-4"><g><rect x="16" y="1078" width="1472" height="54" fill="none" stroke="none" pointer-events="all"/></g><g><g><switch><foreignObject style="overflow: visible; text-align: left;" pointer-events="none" width="100%" height="100%" requiredFeatures="http://www.w3.org/TR/SVG11/feature#Extensibility"><div xmlns="http://www.w3.org/1999/xhtml" style="display: flex; align-items: unsafe center; justify-content: unsafe flex-start; width: 1474px; height: 1px; padding-top: 1105px; margin-left: 16px;"><div style="box-sizing: border-box; font-size: 0; text-align: left; max-height: 54px; overflow: hidden; color: #202020; "><div style="display: inline-block; font-size: 16px; font-family: Arial; color: light-dark(#202020, #d2d2d2); line-height: 1.2; pointer-events: all; white-space: normal; word-wrap: normal; ">Content attention and spatial style attention each use 4 heads and attention width 128. Spatial style refinement happens once after the first GBlock. α is learned per feature channel (initialized at 0.25), not a hardcoded character gate.</div></div></div></foreignObject><text x="16" y="1100" fill="#202020" font-family="Arial" font-size="16px" style="fill: light-dark(rgb(32, 32, 32), rgb(210, 210, 210));"><tspan x="16" y="1100">Content attention and spatial style attention each use 4 heads and attention width 128. Spatial style refinement happens once after the first GBlock. α is learned per feature channel (initialized at 0.25), not a</tspan><tspan x="16" y="1119">hardcoded character gate.</tspan></text></switch></g></g></g><g data-cell-id="explanation-5"><g><rect x="16" y="1140" width="1472" height="54" fill="none" stroke="none" pointer-events="all"/></g><g><g><switch><foreignObject style="overflow: visible; text-align: left;" pointer-events="none" width="100%" height="100%" requiredFeatures="http://www.w3.org/TR/SVG11/feature#Extensibility"><div xmlns="http://www.w3.org/1999/xhtml" style="display: flex; align-items: unsafe center; justify-content: unsafe flex-start; width: 1474px; height: 1px; padding-top: 1167px; margin-left: 16px;"><div style="box-sizing: border-box; font-size: 0; text-align: left; max-height: 54px; overflow: hidden; color: #202020; "><div style="display: inline-block; font-size: 16px; font-family: Arial; color: light-dark(#202020, #d2d2d2); line-height: 1.2; pointer-events: all; white-space: normal; word-wrap: normal; ">Both native heights retain four GBlocks (512→256→128→64→64 channels). Feature heights are 4→8→16→32→32 at H32, or 4→8→16→32→64 at H64. The final stage refines at constant resolution or upsamples according to requested geometry.</div></div></div></foreignObject><text x="16" y="1162" fill="#202020" font-family="Arial" font-size="16px" style="fill: light-dark(rgb(32, 32, 32), rgb(210, 210, 210));"><tspan x="16" y="1162">Both native heights retain four GBlocks (512→256→128→64→64 channels). Feature heights are 4→8→16→32→32 at H32, or 4→8→16→32→64 at H64. The final stage refines at constant resolution or</tspan><tspan x="16" y="1181">upsamples according to requested geometry.</tspan></text></switch></g></g></g><g data-cell-id="explanation-6"><g><rect x="16" y="1202" width="1472" height="35" fill="none" stroke="none" pointer-events="all"/></g><g><g><switch><foreignObject style="overflow: visible; text-align: left;" pointer-events="none" width="100%" height="100%" requiredFeatures="http://www.w3.org/TR/SVG11/feature#Extensibility"><div xmlns="http://www.w3.org/1999/xhtml" style="display: flex; align-items: unsafe center; justify-content: unsafe flex-start; width: 1474px; height: 1px; padding-top: 1220px; margin-left: 16px;"><div style="box-sizing: border-box; font-size: 0; text-align: left; max-height: 35px; overflow: hidden; color: #202020; "><div style="display: inline-block; font-size: 19px; font-family: 'Times New Roman'; color: light-dark(#202020, #d2d2d2); line-height: 1.2; pointer-events: all; white-space: normal; word-wrap: normal; ">T = valid target character count;    output width = 16T at H32 or 32T at H64.    Inference: no loss, backward pass or critic optimizer step.</div></div></div></foreignObject><text x="16" y="1225" fill="#202020" font-family="'Times New Roman'" font-size="19px" style="fill: light-dark(rgb(32, 32, 32), rgb(210, 210, 210));">T = valid target character count; output width = 16T at H32 or 32T at H64. Inference: no loss, backward pass or critic optimizer step.</text></switch></g></g></g></g></g></g><switch><g requiredFeatures="http://www.w3.org/TR/SVG11/feature#Extensibility"/></switch></svg></div></section><section id="p4"><div class="diagram-container"><svg xmlns="http://www.w3.org/2000/svg" style="background: #ffffff; background-color: light-dark(#ffffff, #121212);" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" width="1504px" height="1436px" viewBox="0 0 1504 1436" role="img" aria-labelledby="panel-4-title panel-4-desc"><title id="panel-4-title">(e) Reference-style inference</title><desc id="panel-4-desc">End-to-end ALPHA flow, with exact explanation and objective formulas beneath the diagram.</desc><defs/><rect fill="#ffffff" width="100%" height="100%" x="0" y="0" style="fill: light-dark(rgb(255, 255, 255), rgb(18, 18, 18));"/><g><g data-cell-id="0"><g data-cell-id="zones"><g data-cell-id="paper-panel"><g><rect x="0" y="96" width="1504" height="744" fill="#e9efdf" stro ignObject><text x="16" y="952" fill="#202020" font-family="Arial" font-size="16px" style="fill: light-dark(rgb(32, 32, 32), rgb(210, 210, 210));"><tspan x="16" y="952">B supplies multiscale visual evidence. E separates global pooled style from local residual evidence. During deterministic evaluation, g = mu_g; the seven local tokens are always deterministic. Reference text</tspan><tspan x="16" y="971">labels and writer IDs are not inputs to this inference path.</tspan></text></switch></g></g></g><g data-cell-id="explanation-2"><g><rect x="16" y="992" width="1472" height="35" fill="none" stroke="none" pointer-events="all"/></g><g><g><switch><foreignObject style="overflow: visible; text-align: left;" pointer-events="none" width="100%" height="100%" requiredFeatures="http://www.w3.org/TR/SVG11/feature#Extensibility"><div xmlns="http://www.w3.org/1999/xhtml" style="display: flex; align-items: unsafe center; justify-content: unsafe flex-start; width: 1474px; height: 1px; padding-top: 1010px; margin-left: 16px;"><div style="box-sizing: border-box; font-size: 0; text-align: left; max-height: 35px; overflow: hidden; color: #202020; "><div style="display: inline-block; font-size: 19px; font-family: 'Times New Roman'; color: light-dark(#202020, #d2d2d2); line-height: 1.2; pointer-events: all; white-space: normal; word-wrap: normal; ">g = μ<sub>g</sub>(B(x<sub>ref</sub>));    L = CenterSlots[W<sub>out</sub> Attention(Q<sub>learned</sub>, K<sub>visual+2Dpos</sub>, V<sub>visual−valid mean</sub>)];    S<sub>ref</sub> = [g,L] ∈ ℝ<sup>8×32</sup>.</div></div></div></foreignObject><text x="16" y="1015" fill="#202020" font-family="'Times New Roman'" font-size="19px" style="fill: light-dark(rgb(32, 32, 32), rgb(210, 210, 210));">g = μg(B(xref)); L = CenterSlots[Wout Attention(Qlearned, Kvisual+2Dpos, Vvisual−valid mean)]; Sref = [g,L] ∈ ℝ8×32.</text></switch></g></g></g><g data-cell-id="explanation-3"><g><rect x="16" y="1035" width="1472" height="35" fill="none" stroke="none" pointer-events="all"/></g><g><g><switch><foreignObject style="overflow: visible; text-align: left;" pointer-events="none" width="100%" height="100%" requiredFeatures="http://www.w3.org/TR/SVG11/feature#Extensibility"><div xmlns="http://www.w3.org/1999/xhtml" style="display: flex; align-items: unsafe center; justify-content: unsafe flex-start; width: 1474px; height: 1px; padding-top: 1053px; margin-left: 16px;"><div style="box-sizing: border-box; font-size: 0; text-align: left; max-height: 35px; overflow: hidden; color: #202020; "><div style="display: inline-block; font-size: 19px; font-family: 'Times New Roman'; color: light-dark(#202020, #d2d2d2); line-height: 1.2; pointer-events: all; white-space: normal; word-wrap: normal; ">x<sub>style</sub> = G(S<sub>ref</sub>, y′);    if y′ = y and the target geometry matches the training reconstruction target, this becomes the reconstruction path.</div></div></div></foreignObject><text x="16" y="1058" fill="#202020" font-family="'Times New Roman'" font-size="19px" style="fill: light-dark(rgb(32, 32, 32), rgb(210, 210, 210));">xstyle = G(Sref, y′); if y′ = y and the target geometry matches the training reconstruction target, this becomes the reconstruction path.</text></switch></g></g></g><g data-cell-id="explanation-4"><g><rect x="16" y="1078" width="1472" height="54" fill="none" stroke="none" pointer-events="all"/></g><g><g><switch><foreignObject style="overflow: visible; text-align: left;" pointer-events="none" width="100%" height="100%" requiredFeatures="http://www.w3.org/TR/SVG11/feature#Extensibility"><div xmlns="http://www.w3.org/1999/xhtml" style="display: flex; align-items: unsafe center; justify-content: unsafe flex-start; width: 1474px; height: 1px; padding-top: 1105px; margin-left: 16px;"><div style="box-sizing: border-box; font-size: 0; text-align: left; max-height: 54px; overflow: hidden; color: #202020; "><div style="display: inline-block; font-size: 16px; font-family: Arial; color: light-dark(#202020, #d2d2d2); line-hei
