w describe that full objective.</div></div></div></foreignObject><text x="16" y="1363" fill="#202020" font-family="Arial" font-size="18px" style="fill: light-dark(rgb(32, 32, 32), rgb(210, 210, 210));">This panel isolates the reference-guided training path: x_ref → B → E → S_ref → G(S_ref,y′) → D/R/W+B → losses. There is NO random-style input in this path. The same shared G/D/P also train on random x_rand and reconstruction x_rec, shown in (b)/(c)/(d); the equations below describe that full objective.</text></switch></g></g></g><g data-cell-id="explain-2"><g><rect x="16" y="1386" width="2752" height="40" fill="none" stroke="none" pointer-events="all"/></g><g><g><switch><foreignObject style="overflow: visible; text-align: left;" pointer-events="none" width="100%" height="100%" requiredFeatures="http://www.w3.org/TR/SVG11/feature#Extensibility"><div xmlns="http://www.w3.org/1999/xhtml" style="display: flex; align-items: unsafe center; justify-content: unsafe flex-start; width: 2754px; height: 1px; padding-top: 1406px; margin-left: 16px;"><div style="box-sizing: border-box; font-size: 0; text-align: left; max-height: 40px; overflow: hidden; color: #202020; "><div style="display: inline-block; font-size: 22px; font-family: 'Times New Roman'; color: light-dark(#202020, #d2d2d2); line-height: 1.2; pointer-events: all; white-space: normal; word-wrap: normal; ">L<sub>D</sub> = E[(1 − D(x))₊] + (1/3) ∑<sub>b</sub> E[(1 + D(stop(x<sub>b</sub>)))₊] + L<sub>R1</sub>,    b ∈ {rand, style, rec}.</div></div></div></foreignObject><text x="16" y="1413" fill="#202020" font-family="'Times New Roman'" font-size="22px" style="fill: light-dark(rgb(32, 32, 32), rgb(210, 210, 210));">LD = E[(1 − D(x))₊] + (1/3) ∑b E[(1 + D(stop(xb)))₊] + LR1, b ∈ {rand, style, rec}.</text></switch></g></g></g><g data-cell-id="explain-3"><g><rect x="16" y="1436" width="2752" height="40" fill="none" stroke="none" pointer-events="all"/></g><g><g><switch><foreignObject style="overflow: visible; text-align: left;" pointer-events="none" width="100%" height="100%" requiredFeatures="http://www.w3.org/TR/SVG11/feature#Extensibility"><div xmlns="http://www.w3.org/1999/xhtml" style="display: flex; align-items: unsafe center; justify-content: unsafe flex-start; width: 2754px; height: 1px; padding-top: 1456px; margin-left: 16px;"><div style="box-sizing: border-box; font-size: 0; text-align: left; max-height: 40px; overflow: hidden; color: #202020; "><div style="display: inline-block; font-size: 22px; font-family: 'Times New Roman'; color: light-dark(#202020, #d2d2d2); line-height: 1.2; pointer-events: all; white-space: normal; word-wrap: normal; ">L<sub>adv</sub> = −(1/3) ∑<sub>b</sub> E[D(x<sub>b</sub>)];    L<sub>CTC</sub> = λ<sub>r</sub> CTC(R(x<sub>rand</sub>), y′) + λ<sub>s</sub> CTC(R(x<sub>style</sub>), y′);    L<sub>writer</sub> = CE(W(B(x<sub>style</sub>)), w).</div></div></div></foreignObject><text x="16" y="1463" fill="#202020" font-family="'Times New Roman'" font-size="22px" style="fill: light-dark(rgb(32, 32, 32), rgb(210, 210, 210));">Ladv = −(1/3) ∑b E[D(xb)]; LCTC = λr CTC(R(xrand), y′) + λs CTC(R(xstyle), y′); Lwriter = CE(W(B(xstyle)), w).</text></switch></g></g></g><g data-cell-id="explain-4"><g><rect x="16" y="1486" width="2752" height="40" fill="none" stroke="none" pointer-events="all"/></g><g><g><switch><foreignObject style="overflow: visible; text-align: left;" pointer-events="none" width="100%" height="100%" requiredFeatures="http://www.w3.org/TR/SVG11/feature#Extensibility"><div xmlns="http://www.w3.org/1999/xhtml" style="display: flex; align-items: unsafe center; justify-content: unsafe flex-start; width: 2754px; height: 1px; padding-top: 1506px; margin-left: 16px;"><div style="box-sizing: border-box; font-size: 0; text-align: left; max-height: 40px; overflow: hidden; color: #202020; "><div style="display: inline-block; font-size: 22px; font-family: 'Times New Roman'; color: light-dark(#202020, #d2d2d2); line-height: 1.2; pointer-events: all; white-space: normal; word-wrap: normal; ">L<sub>G,E</sub> = L<sub>adv</sub> + 0.45 L<sub>adv,P</sub> + L<sub>CTC</sub> + 0.5 L<sub>writer</sub> + λ<sub>rec</sub> L<sub>rec</sub> + L<sub>info</sub> + L<sub>cycle</sub> + 0.02 L<sub>content</sub> + 0.1 L<sub>ctx</sub> + 0.1 L<sub>KL</sub>.</div></div></div></foreignObject><text x="16" y="1513" fill="#202020" font-family="'Times New Roman'" font-size="22px" style="fill: light-dark(rgb(32, 32, 32), rgb(210, 210, 210));">LG,E = Ladv + 0.45 Ladv,P + LCTC + 0.5 Lwriter + λrec Lrec + Linfo + Lcycle + 0.02 Lcontent + 0.1 Lctx + 0.1 LKL.</text></switch></g></g></g><g data-cell-id="explain-5"><g><rect x="16" y="1536" width="2752" height="37" fill="none" stroke="none" pointer-events="all"/></g><g><g><switch><foreignObject style="overflow: visible; text-align: left;" pointer-events="none" width="100%" height="100%" requiredFeatures="http://www.w3.org/TR/SVG11/feature#Extensibility"><div xmlns="http://www.w3.org/1999/xhtml" style="display: flex; align-items: unsafe center; justify-content: unsafe flex-start; width: 2754px; height: 1px; padding-top: 1555px; margin-left: 16px;"><div style="box-sizing: border-box; font-size: 0; text-align: left; max-height: 37px; overflow: hidden; color: #202020; "><div style="display: inline-block; font-size: 18px; font-family: Arial; color: light-dark(#202020, #d2d2d2); line-height: 1.2; pointer-events: all; white-space: normal; word-wrap: normal; ">D/P update every batch; G/E update every second critic batch. In the G/E phase, D/P/B/R/W parameters are frozen but input gradients remain. R and W+B are pretrained on real images; W+B starts from the OCR CNN. See (b)/(c) for the other losses.</div></div></div></foreignObject><text x="16" y="1560" fill="#202020" font-family="Arial" font-size="18px" style="fill: light-dark(rgb(32, 32, 32), rgb(210, 210, 210));">D/P update every batch; G/E update every second critic batch. In the G/E phase, D/P/B/R/W parameters are frozen but input gradients remain. R and W+B are pr www.w3.org/TR/SVG11/feature#Extensibility"><div xmlns="http://www.w3.org/1999/xhtml" style="display: flex; align-items: unsafe center; justify-content: unsafe flex-start; width: 2754px; height: 1px; padding-top: 24px; margin-left: 16px;"><div style="box-sizing: border-box; font-size: 0; text-align: left; max-height: 48px; overflow: hidden; color: #202020; "><div style="display: inline-block; font-size: 30px; font-family: Arial; color: light-dark(#202020, #d2d2d2); line-height: 1.2; pointer-events: all; font-weight: bold; white-space: normal; word-wrap: normal; ">(b) Regularization with reconstruction</div></div></div></foreignObject><text x="16" y="33" fill="#202020" font-family="Arial" font-size="30px" font-weight="bold" style="fill: light-dark(rgb(32, 32, 32), rgb(210, 210, 210));">(b) Regularization with reconstruction</text></switch></g></g></g><g data-cell-id="subtitle"><g><rect x="16" y="60" width="2752" height="32" fill="none" stroke="none" pointer-events="all"/></g><g><g><switch><foreignObject style="overflow: visible; text-align: left;" pointer-events="none" width="100%" height="100%" requiredFeatures="http://www.w3.org/TR/SVG11/feature#Extensibility"><div xmlns="http://www.w3.org/1999/xhtml" style="display: flex; align-items: unsafe center; justify-content: unsafe flex-start; width: 2754px; height: 1px; padding-top: 76px; margin-left: 16px;"><div style="box-sizing: border-box; font-size: 0; text-align: left; max-height: 32px; overflow: hidden; color: #202020; "><div style="display: inline-block; font-size: 17px; font-family: Arial; color: light-dark(#202020, #d2d2d2); line-height: 1.2; pointer-events: all; white-space: normal; word-wrap: normal; ">Image reconstruction and two global-code recovery paths share G/E; the local tokens are deterministic and have no KL term</div></div></div></foreignObject><text x="16" y="81" fill="#202020" font-family="Arial" font-size="17px" style="fill: light-dark(rgb(32, 32, 32), rgb(210, 210, 210));">Image reconstruction and two global-code recovery paths share G/E; the local tokens are deterministic and have no KL term</text></switch></g></g></g><g data-cell-id="legend"><g><rect x="16" y="1244" width="2752" height="28" fill="none" stroke="none" pointer-events="all"/></g><g><g><switch><foreignObject style="overflow: visible; text-align: left;" pointer-events="none" width="100%" height="100%" requiredFeatures="http://www.w3.org/TR/SVG11/feature#Extensibility"><div xmlns="http://www.w3.org/1999/xhtml" style="display: flex; align-items: unsafe center; justify-content: unsafe flex-start; width: 2754px; height: 1px; padding-top: 1258px; margin-left: 16px;"><div style="box-sizing: border-box; font-size: 0; text-align: left; max-height: 28px; overflow: hidden; color: #202020; "><div style="display: inline-block; font-size: 16px; font-family: Arial; color: light-dark(#202020, #d2d2d2); line-height: 1.2; pointer-events: all; white-space: normal; word-wrap: normal; ">C1: global/local E   ·   C2: content-first fusion   ·   C3: StrokePatchD/crops   |   Solid: forward   ·   Dashed: loss/target   ·   Green: global-style conditioning</div></div></div></foreignObject><text x="16" y="1263" fill="#202020" font-family="Arial" font-size="16px" style="fill: light-dark(rgb(32, 32, 32), rgb(210, 210, 210));">C1: global/local E · C2: content-first fusion · C3: StrokePatchD/crops | Solid: forward · Dashed: loss/target · Green: global-style conditioning</text></switch></g></g></g><g data-cell-id="explain-0"><g><rect x="16" y="1292" width="2752" height="37" fill="none" stroke="none" pointer-events="all"/></g><g><g><switch><foreignObject style="overflow: visible; text-align: left;" pointer-events="none" width="100%" height="100%" requiredFeatures="http://www.w3.org/TR/SVG11/feature#Extensibility"><div xmlns="http://www.w3.org/1999/xhtml" style="display: flex; align-items: unsafe center; justify-content: unsafe flex-start; width: 2754px; height: 1px; padding-top: 1311px; margin-left: 16px;"><div style="box-sizing: border-box; font-size: 0; text-align: left; max-height: 37px; overflow: hidden; color: #202020; "><div style="display: inline-block; font-size: 21px; font-family: Arial; color: light-dark(#202020, #d2d2d2); line-height: 1.2; pointer-events: all; font-weight: bold; white-space: normal; word-wrap: normal; ">What is reconstructed — and what is not</div></div></div></foreignObject><text x="16" y="1317" fill="#202020" font-family="Arial" font-size="21px" font-weight="bold" style="fill: light-dark(rgb(32, 32, 32), rgb(210, 210, 210));">What is reconstructed — and what is not</text></switch></g></g></g><g data-cell-id="explain-1"><g><rect x="16" y="1339" width="2752" height="37" fill="none" stroke="none" pointer-events="all"/></g><g><g><switch><foreignObject style="overflow: visible; text-align: left;" pointer-events="none" width="100%" height="100%" requiredFeatures="http://www.w3.org/TR/SVG11/feature#Extensibility"><div xmlns="http://www.w3.org/1999/xhtml" style="display: flex; align-items: unsafe center; justify-content: unsafe flex-start; width: 2754px; height: 1px; padding-top: 1358px; margin-left: 16px;"><div style="box-sizing: border-box; font-size: 0; text-align: left; max-height: 37px; overflow: hidden; color: #202020; "><div style="display: inline-block; font-size: 18px; font-family: Arial; color: light-dark(#202020, #d2d2d2); line-height: 1.2; pointer-events: all; white-space: normal; word-wrap: normal; ">Pixel L1 compares x_rec to the canonical real image x over valid pixels, not to the original-width style reference. Global information recovery reconstructs the prior z_g; transfer cycle recovers the reference global mean. These are separate targets, not three copies of one loss.</div></div></div></foreignObject><text x="16" y="1363" fill="#202020" font-family="Arial" font-size="18px" style="fill: light-dark(rgb(32, 32, 32), rgb(210, 210, 210));">Pixel L1 compares x_rec to the canonical real image x over valid pixels, not to the original-width style reference. Global information recovery reconstructs the prior z_g; transfer cycle recovers the reference global mean. These are separate targets, not three copies of one loss.</text></switch></g></g></g><g data-cell-id="explain-2"><g><rect x="16" y="1386" width="2752" height="40" fill="none" stroke="none" pointer-events="all"/></g><g><g><switch><foreignObject style="overflow: visible; text-align: left;" pointer-events="none" width="100%" height="100%" requiredFeatures="http://www.w3.org/TR/SVG11/feature#Extensibility"><div xmlns="http://www.w3.org/1999/xhtml" style="display: flex; align-items: unsafe center; justify-content: unsafe flex-start; width: 2754px; height: 1px; padding-top: 1406px; margin-left: 16px;"><div style="box-sizing: border-box; font-size: 0; text-align: left; max-height: 40px; overflow: hidden; color: #202020; "><div style="display: inline-block; font-size: 22px; font-family: 'Times New Roman'; color: light-dark(#202020, #d2d2d2); line-height: 1.2; pointer-events: all; white-space: normal; word-wrap: normal; ">L<sub>rec</sub> = mean<sub>valid</sub> |x<sub>rec</sub> − x|;    L<sub>info</sub> = mean |E<sub>g</sub>(B(x<sub>rand</sub>)) − stop(z<sub>g</sub>)| / 8;    L<sub>cycle</sub> = mean |E<sub>g</sub>(B(x<sub>style</sub>)) − stop(μ<sub>g,ref</sub>)| / 8.</div></div></div></foreignObject><text x="16" y="1413" fill="#202020" font-family="'Times New Roman'" font-size="22px" style="fill: light-dark(rgb(32, 32, 32), rgb(210, 210, 210));">Lrec = meanvalid |xrec − x|; Linfo = mean |Eg(B(xrand)) − stop(zg)| / 8; Lcycle = mean |Eg(B(xstyle)) − stop(μg,ref)| / 8.</text></switch></g></g></g><g data-cell-id="explain-3"><g><rect x="16" y="1436" width="2752" height="40" fill="none" stroke="none" pointer-events="all"/></g><g><g><switch><foreignObject style="overflow: visible; text-align: left;" pointer-events="none" width="100%" height="100%" requiredFeatures="http://www.w3.org/TR/SVG11/feature#Extensibility"><div xmlns="http://www.w3.org/1999/xhtml" style="display: flex; align-items: unsafe center; justify-content: unsafe flex-start; width: 2754px; height: 1px; padding-top: 1456px; margin-left: 16px;"><div style="box-sizing: border-box; font-size: 0; text-align: left; max-height: 40px; overflow: hidden; color: #202020; "><div style="display: inline-block; font-size: 22px; font-family: 'Times New Roman'; color: light-dark(#202020, #d2d2d2); line-height: 1.2; pointer-events: all; white-space: normal; word-wrap: normal; ">L<sub>KL</sub> = KL[N(μ<sub>g</sub>, diag(exp(ℓ<sub>g</sub>))) || N(0,I)] / 8;    g = μ<sub>g</sub> + exp(0.5 ℓ<sub>g</sub>) ⊙ ε;    ε ∼ N(0,I);    ℓ<sub>g</sub> = log σ<sub>g</sub>².</div></div></div></foreignObject><text x="16" y="1463" fill="#202020" font-family="'Times New Roman'" font-size="22px" style="fill: light-dark(rgb(32, 32, 32), rgb(210, 210, 210));">LKL = KL[N(μg, diag(exp(ℓg))) || N(0,I)] / 8; g = μg + exp(0.5 ℓg) ⊙ ε; ε ∼ N(0,I); ℓg = log σg².</text></switch></g></g></g><g data-cell-id="explain-4"><g><rect x="16" y="1486" width="2752" height="40" fill="none" stroke="none" pointer-events="all"/></g><g><g><switch><foreignObject style="overflow: visible; text-align: left;" pointer-events="none" width="100%" height="100%" requiredFeatures="http://www.w3.org/TR/SVG11/feature#Extensibility"><div xmlns="http://www.w3.org/1999/xhtml" style="display: flex; align-items: unsafe center; justify-content: unsafe flex-start; width: 2754px; height: 1px; padding-top: 1506px; margin-left: 16px;"><div style="box-sizing: border-box; font-size: 0; text-align: left; max-height: 40px; overflow: hidden; color: #202020; "><div style="display: inline-block; font-size: 22px; font-family: 'Times New Roman'; color: light-dark(#202020, #d2d2d2); line-height: 1.2; pointer-events: all; white-space: normal; word-wrap: normal; ">L<sub>content</sub> = balanced-BCE(Probe(GRL(μ<sub>g,ref</sub>)), bag(y)) / 8;    GRL is identity forward and reverses only the gradient toward E.</div></div></div></foreignObject><text x="16" y="1513" fill="#202020" font-family="'Times New Roman'" font-size="22px" style="fill: light-dark(rgb(32, 32, 32), rgb(210, 210, 210));">Lcontent = balanced-BCE(Probe(GRL(μg,ref)), bag(y)) / 8; GRL is identity forward and reverses only the gradient toward E.</text></switch></g></g></g><g data-cell-id="explain-5"><g><rect x="16" y="1536" width="2752" height="37" fill="none" stroke="none" pointer-events="all"/></g><g><g><switch><foreignObject style="overflow: visible; text-align: left;" pointer-events="none" width="100%" height="100%" requiredFeatures="http://www.w3.org/TR/SVG11/feature#Extensibility"><div xmlns="http://www.w3.org/1999/xhtml" style="display: flex; align-items: unsafe center; justify-content: unsafe flex-start; width: 2754px; height: 1px; padding-top: 1555px; margin-left: 16px;"><div style="box-sizing: border-box; font-size: 0; text-align: left; max-height: 37px; overflow: hidden; color: #202020; "><div style="display: inline-block; font-size: 18px; font-family: Arial; color: light-dark(#202020, #d2d2d2); line-height: 1.2; pointer-events: all; white-space: normal; word-wrap: normal; ">The probe learns reference character presence while E is pushed to hide it in g. Local L is a deterministic, centered 7-token residual; it is neither KL-regularized nor reconstructed against random local slots. E_g skips local retrieval. All repeated B/E/G blocks share weights.</div></div></div></foreignObject><text x="16" y="1560" fill="#202020" font-family="Arial" font-size="18px" style="fill: light-dark(rgb(32, 32, 32), rgb(210, 210, 210));">The probe learns reference character presence while E is pushed to hide it in g. Local L is a deterministic, centered 7-token residual; it is neither KL-regularized nor reconstructed against random local slots. E_g skips local retrieval. All repeated B/E/G blocks share weights.</text></switch></g></g></g><g data-cell-id="explain-6"><g><rect x="16" y="1583" width="2752" height="37" fill="none" stroke="none" pointer-events="all"/></g><g><g><switch><foreignObject style="overflow: visible; text-align: left;" pointer-events="none" width="100%" height="100%" requiredFeatures="http://www.w3.org/TR/SVG11/feature#Extensibility"><div xmlns="http://www.w3.org/1999/xhtml" style="display: flex; align-items: unsafe center; justify-content: unsafe flex-start; width: 2754px; height: 1px; padding-top: 1602px; margin-left: 16px;"><div style="box-sizing: border-box; font-size: 0; text-align: left; max-height: 37px; overflow: hidden; color: #202020; "><div style="display: inline-block; font-size: 18px; font-family: Arial; color: light-dark(#202020, #d2d2d2); line-height: 1.2; pointer-events: all; white-space: normal; word-wrap: normal; ">These three generated branches also receive the global and patch adversarial losses in (a)/(c). Only x_rand and x_style receive OCR CTC. The /8 factors preserve the explicit eight-token normalization implemented in the current loss functions.</div></div></div></foreignObject><text x="16" y="1607" fill="#202020" font-family="Arial" font-size="18px" style="fill: light-dark(rgb(32, 32, 32), rgb(210, 210, 210));">These three generated branches also receive the global and patch adversarial losses in (a)/(c). Only x_rand and x_style receive OCR CTC. The /8 factors preserve the explicit eight-token normalization implemented in the current loss functions.</text></switch></g></g></g><g data-cell-id="explain-7"><g><rect x="16" y="1630" width="2752" height="37" fill="none" stroke="none" pointer-events="all"/></g><g><g><switch><foreignObject style="overflow: visible; text-align: left;" pointer-events="none" width="100%" height="100%" requiredFeatures="http://www.w3.org/TR/SVG11/feature#Extensibility"><div xmlns="http://www.w3.org/1999/xhtml" style="display: flex; align-items: unsafe center; justify-content: unsafe flex-start; width: 2754px; height: 1px; padding-top: 1649px; margin-left: 16px;"><div style="box-sizing: border-box; font-size: 0; text-align: left; max-height: 37px; overflow: hidden; color: #20 ord-wrap: normal; ">One crop policy; two complementary supervision signals</div></div></div></foreignObject><text x="16" y="1317" fill="#202020" font-family="Arial" font-size="21px" font-weight="bold" style="fill: light-dark(rgb(32, 32, 32), rgb(210, 210, 210));">One crop policy; two complementary supervision signals</text></switch></g></g></g><g data-cell-id="explain-1"><g><rect x="16" y="1339" width="2752" height="37" fill="none" stroke="none" pointer-events="all"/></g><g><g><switch><foreignObject style="overflow: visible; text-align: left;" pointer-events="none" width="100%" height="100%" requiredFeatures="http://www.w3.org/TR/SVG11/feature#Extensibility"><div xmlns="http://www.w3.org/1999/xhtml" style="display: flex; align-items: unsafe center; justify-content: unsafe flex-start; width: 2754px; height: 1px; padding-top: 1358px; margin-left: 16px;"><div style="box-sizing: border-box; font-size: 0; text-align: left; max-height: 37px; overflow: hidden; color: #202020; "><div style="display: inline-block; font-size: 18px; font-family: Arial; color: light-dark(#202020, #d2d2d2); line-height: 1.2; pointer-events: all; white-space: normal; word-wrap: normal; ">Crop side s = H/2 (16 at H32, 32 at H64). Horizontal start positions are stratified; vertical locations alternate upper/lower halves. Real and all fake branches use the same policy, not identical coordinates. Only P receives these crops; global D always receives complete words.</div></div></div></foreignObject><text x="16" y="1363" fill="#202020" font-family="Arial" font-size="18px" style="fill: light-dark(rgb(32, 32, 32), rgb(210, 210, 210));">Crop side s = H/2 (16 at H32, 32 at H64). Horizontal start positions are stratified; vertical locations alternate upper/lower halves. Real and all fake branches use the same policy, not identical coordinates. Only P receives these crops; global D always receives complete words.</text></switch></g></g></g><g data-cell-id="explain-2"><g><rect x="16" y="1386" width="2752" height="40" fill="none" stroke="none" pointer-events="all"/></g><g><g><switch><foreignObject style="overflow: visible; text-align: left;" pointer-events="none" width="100%" height="100%" requiredFeatures="http://www.w3.org/TR/SVG11/feature#Extensibility"><div xmlns="http://www.w3.org/1999/xhtml" style="display: flex; align-items: unsafe center; justify-content: unsafe flex-start; width: 2754px; height: 1px; padding-top: 1406px; margin-left: 16px;"><div style="box-sizing: border-box; font-size: 0; text-align: left; max-height: 40px; overflow: hidden; color: #202020; "><div style="display: inline-block; font-size: 22px; font-family: 'Times New Roman'; color: light-dark(#202020, #d2d2d2); line-height: 1.2; pointer-events: all; white-space: normal; word-wrap: normal; ">K<sub>n</sub> = clamp(ceil(W<sub>n</sub> / (H/2)), 4, 8);    L<sub>P</sub> = HingeMap(P(C(x)), +1) + (1/3) ∑<sub>b</sub> HingeMap(P(C(stop(x<sub>b</sub>))), −1).</div></div></div></foreignObject><text x="16" y="1413" fill="#202020" font-family="'Times New Roman'" font-size="22px" style="fill: light-dark(rgb(32, 32, 32), rgb(210, 210, 210));">Kn = clamp(ceil(Wn / (H/2)), 4, 8); LP = HingeMap(P(C(x)), +1) + (1/3) ∑b HingeMap(P(C(stop(xb))), −1).</text></switch></g></g></g><g data-cell-id="explain-3"><g><rect x="16" y="1436" width="2752" height="40" fill="none" stroke="none" pointer-events="all"/></g><g><g><switch><foreignObject style="overflow: visible; text-align: left;" pointer-events="none" width="100%" height="100%" requiredFeatures="http://www.w3.org/TR/SVG11/feature#Extensibility"><div xmlns="http://www.w3.org/1999/xhtml" style="display: flex; align-items: unsafe center; justify-content: unsafe flex-start; width: 2754px; height: 1px; padding-top: 1456px; margin-left: 16px;"><div style="box-sizing: border-box; font-size: 0; text-align: left; max-height: 40px; overflow: hidden; color: #202020; "><div style="display: inline-block; font-size: 22px; font-family: 'Times New Roman'; color: light-dark(#202020, #d2d2d2); line-height: 1.2; pointer-events: all; white-space: normal; word-wrap: normal; ">L<sub>adv,P</sub> = −(1/3) ∑<sub>b</sub> MeanWord[MeanCrop[MeanMap[P(C(x<sub>b</sub>))]]];    generator contribution = 0.45 L<sub>adv,P</sub>.</div></div></div></foreignObject><text x="16" y="1463" fill="#202020" font-family="'Times New Roman'" font-size="22px" style="fill: light-dark(rgb(32, 32, 32), rgb(210, 210, 210));">Ladv,P = −(1/3) ∑b MeanWord[MeanCrop[MeanMap[P(C(xb))]]]; generator contribution = 0.45 Ladv,P.</text></switch></g></g></g><g data-cell-id="explain-4"><g><rect x="16" y="1486" width="2752" height="40" fill="none" stroke="none" pointer-events="all"/></g><g><g><switch><foreignObject style="overflow: visible; text-align: left;" pointer-events="none" width="100%" height="100%" requiredFeatures="http://www.w3.org/TR/SVG11/feature#Extensibility"><div xmlns="http://www.w3.org/1999/xhtml" style="display: flex; align-items: unsafe center; justify-content: unsafe flex-start; width: 2754px; height: 1px; padding-top: 1506px; margin-left: 16px;"><div style="box-sizing: border-box; font-size: 0; text-align: left; max-height: 40px; overflow: hidden; color: #202020; "><div style="display: inline-block; font-size: 22px; font-family: 'Times New Roman'; color: light-dark(#202020, #d2d2d2); line-height: 1.2; pointer-events: all; white-space: normal; word-wrap: normal; ">L<sub>ctx</sub> = ∑<sub>l</sub> CX(stop(B<sub>l</sub>(x<sub>ref</sub>)), B<sub>l</sub>(x<sub>style</sub>));    generator contribution = 0.1 L<sub>ctx</sub>;    l ∈ {three selected backbone scales}.</div></div></div></foreignObject><text x="16" y="1513" fill="#202020" font-family="'Times New Roman'" font-size="22px" style="fill: light-dark(rgb(32, 32, 32), rgb(210, 210, 210));">Lctx = ∑l CX(stop(Bl(xref)), Bl(xstyle)); generator contribution = 0.1 Lctx; l ∈ {three selected backbone scales}.</text></switch></g></g></g><g data-cell-id="explain-5"><g><rect x="16" y="1536" width="2752" height="37" fill="none" stroke="
